<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local RAG Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.1rem; color: #58a6ff; }
    header span { font-size: 0.75rem; color: #8b949e; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 18px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 0.92rem;
    }

    .message.user {
      background: #1f6feb22;
      border: 1px solid #1f6feb55;
      align-self: flex-end;
      color: #cdd9e5;
    }

    .message.assistant {
      background: #161b22;
      border: 1px solid #30363d;
      align-self: flex-start;
      white-space: pre-wrap;
    }

    .message .sources {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #30363d;
      font-size: 0.78rem;
      color: #8b949e;
    }

    .message .sources span {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 2px 8px;
      margin-right: 6px;
      display: inline-block;
      margin-top: 4px;
    }

    .thinking {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
    }
    .thinking span {
      width: 8px; height: 8px;
      background: #58a6ff;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
    }

    #input-area {
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 16px 24px;
    }

    #input-row {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #question-input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e1e4e8;
      font-size: 0.92rem;
      padding: 10px 14px;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      outline: none;
      transition: border-color 0.2s;
    }
    #question-input:focus { border-color: #58a6ff; }

    #send-btn {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 0.9rem;
      height: 44px;
      transition: background 0.2s;
    }
    #send-btn:hover { background: #2ea043; }
    #send-btn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

    #upload-row {
      max-width: 780px;
      margin: 8px auto 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: #8b949e;
    }

    #upload-input { display: none; }

    #upload-label {
      cursor: pointer;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.8rem;
      transition: background 0.2s;
    }
    #upload-label:hover { background: #30363d; }

    #upload-status { color: #3fb950; }

    /* Quick action buttons */
    #quick-actions {
      max-width: 780px;
      margin: 0 auto 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .quick-btn {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 20px;
      color: #8b949e;
      font-size: 0.78rem;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-btn:hover { background: #30363d; color: #e1e4e8; border-color: #58a6ff; }
  </style>
</head>
<body>

<header>
  <h1>🤖 Local RAG Assistant</h1>
  <span>Powered by Foundry Local — Tamamen Çevrimdışı</span>
</header>

<div id="chat-container">
  <div class="message assistant">
    Merhaba! Ben yerel RAG asistanınım. Dokümanlarınız hakkında soru sorabilirsiniz.<br><br>
    Şu an yüklü dokümanlar: <strong>OneDrive, Teams, Azure AI Foundry, Microsoft 365, Windows 11</strong> konularında destek belgelerim var.
  </div>
</div>

<div id="input-area">
  <div id="quick-actions">
    <button class="quick-btn" onclick="askQuick('OneDrive senkronizasyon hatası nasıl çözülür?')">📁 OneDrive Hatası</button>
    <button class="quick-btn" onclick="askQuick('Teams şifresini nasıl sıfırlarım?')">🔑 Şifre Sıfırla</button>
    <button class="quick-btn" onclick="askQuick('Azure AI Foundry model yayınlama adımları nelerdir?')">☁️ Azure Model</button>
    <button class="quick-btn" onclick="askQuick('Windows 11 güncelleme hatası nasıl çözülür?')">🪟 Windows Update</button>
    <button class="quick-btn" onclick="askQuick('Teams toplantı odası kurulumu nasıl yapılır?')">🏢 Teams Room</button>
    <button class="quick-btn" onclick="askQuick('E-posta yönlendirme nasıl yapılır?')">📧 E-posta Yönlendirme</button>
  </div>

  <div id="input-row">
    <textarea id="question-input" placeholder="Soru sor..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="sendQuestion()">Gönder</button>
  </div>

  <div id="upload-row">
    <label id="upload-label" for="upload-input">📄 Doküman Yükle</label>
    <input type="file" id="upload-input" accept=".md,.txt" onchange="uploadFile(this)" />
    <span id="upload-status"></span>
  </div>
</div>

<script>
  const chatContainer = document.getElementById("chat-container");
  const input = document.getElementById("question-input");
  const sendBtn = document.getElementById("send-btn");

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 140) + "px";
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  }

  function askQuick(question) {
    input.value = question;
    autoResize(input);
    sendQuestion();
  }

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = `message ${role}`;
    div.textContent = text;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return div;
  }

  function showThinking() {
    const div = document.createElement("div");
    div.className = "message assistant thinking";
    div.innerHTML = "<span></span><span></span><span></span>";
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return div;
  }

  async function sendQuestion() {
    const question = input.value.trim();
    if (!question) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    appendMessage("user", question);
    const thinkingEl = showThinking();

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      thinkingEl.remove();
      const msgEl = appendMessage("assistant", "");

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const json = JSON.parse(line.slice(6));

          if (json.delta) {
            msgEl.textContent += json.delta;
            chatContainer.scrollTop = chatContainer.scrollHeight;
          }

          if (json.done && json.sources && json.sources.length > 0) {
            const sourcesDiv = document.createElement("div");
            sourcesDiv.className = "sources";
            sourcesDiv.innerHTML = "📚 Kaynaklar: " +
              json.sources.map(s => `<span>${s}</span>`).join("");
            msgEl.appendChild(sourcesDiv);
          }

          if (json.error) {
            msgEl.textContent = "Hata: " + json.error;
          }
        }
      }
    } catch (err) {
      thinkingEl.remove();
      appendMessage("assistant", "Bağlantı hatası: " + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  async function uploadFile(input) {
    const file = input.files[0];
    if (!file) return;

    const status = document.getElementById("upload-status");
    status.textContent = "Yükleniyor...";

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch("/api/upload", { method: "POST", body: formData });
      const data = await res.json();
      if (res.ok) {
        status.textContent = `✓ ${data.message} (${data.chunkCount} chunk)`;
      } else {
        status.textContent = "Hata: " + data.error;
      }
    } catch (err) {
      status.textContent = "Yükleme hatası: " + err.message;
    }

    input.value = "";
  }
</script>
</body>
</html>
